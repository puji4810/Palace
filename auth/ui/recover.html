<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#171717" />
    <meta name="robots" content="noindex, nofollow" />
    <title>恢复访问 · Palace</title>
    <link rel="icon" href="/__palace/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/__palace/app.css" />
  </head>
  <body data-page="recover">
    <main class="shell">
      <header class="brand"><span class="mark">P</span><span>Palace</span></header>

      <section class="card">
        <h1>恢复访问</h1>
        <p class="lead">
          你当前处于 15 分钟的受限恢复会话。它只能创建新通行密钥，不能读取 Palace 数据或执行任务。
        </p>

        <div class="notice" id="recover-method">正在读取恢复会话…</div>
        <p class="hint hint-block">
          如果只是取消了密码管理器或系统通行密钥窗口，请点“返回登录”，用已有通行密钥登录。只有确实丢失了原设备，才需要在这里创建新通行密钥。
        </p>
        <button class="btn ghost-block" id="cancel-recovery" type="button">返回登录（使用已有通行密钥）</button>

        <form id="passkey-form" class="stack" autocomplete="off">
          <label class="field">
            <span>新通行密钥名称（可选）</span>
            <input id="passkey-name" placeholder="例如：恢复后的手机" maxlength="60" autocomplete="off" />
          </label>
          <label class="check">
            <input type="checkbox" id="revoke-others" checked />
            <span>同时撤销其他通行密钥（推荐：无法确认丢失设备时保持勾选）</span>
          </label>
          <button class="btn primary" type="submit">创建新通行密钥</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="section">
          <p class="hint">恢复会话在 15 分钟后过期。若无法创建通行密钥，可让服务器管理员通过 SSH 重置。</p>
        </div>
      </section>

      <footer class="foot">受限恢复会话不能读取 Palace 数据或执行任务。</footer>
    </main>
    <script type="module" src="/__palace/app.js"></script>
  </body>
</html>
