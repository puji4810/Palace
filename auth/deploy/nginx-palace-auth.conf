# Palace public entry: cloudflared -> this listener -> Palace auth gateway.
# The gateway is the only component allowed to talk to DSH (127.0.0.1:3080).
server {
    listen 127.0.0.1:3081;
    server_name bot.pu-ji.top;
    access_log off;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The gateway issues __Host- cookies with Secure/SameSite=Lax itself.
        # Do not rewrite its Set-Cookie attributes here.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
